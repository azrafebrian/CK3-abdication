l_english:
 halfsade_abdicate_decision:0 "Abdicate the Throne"
 halfsade_abdicate_decision_tooltip:0 "Announce your abdication. The crown passes to your [primary_heir|E] in a few days."
 halfsade_abdicate_decision_desc:0 "#F A wise ruler knows when their watch has ended. To ensure the stability of my house, I shall formally renounce my titles and entrust the future of the realm to my successor.#!"
 halfsade_abdicate_decision_confirm:0 "Announce Abdication"
 halfsade_abdicate_title_effect:0 "#N All your#! [titles|E] #N and#! [vassals|E] #N will be passed to your heir,#! [halfsade_abdicate_heir.GetTitledFirstName]."
 halfsade_abdicate_title_effect_no_heir:0 "#N All your#! [titles|E] #N and#! [vassals|E] #N will be passed to your heir.#!"
 halfsade_abdicate_has_heir_tt:0 "You have a [primary_heir|E]"
 halfsade_abdicate_heir_incapable_tt:0 "Your [primary_heir|E] do #bold not#! have the [trait|E]: [GetTrait('incapable').GetName( GetPlayer )]"
 halfsade_abdicate_heir_free_tt:0 "Your [primary_heir|E] is #bold not#! [imprisoned|E]"
 halfsade_abdicate_heir_peace_tt:0 "Your [primary_heir|E] is #bold not#! at war with you"
 halfsade_abdicate_heir_not_rival_tt:0 "Your [primary_heir|E] is #bold not#! your [rival|E]"
 halfsade_abdicate_heir_former_ruler_tt:0 "Your [primary_heir|E] is #bold not#! your predecessor"
 halfsade_abdicate_self_capable_tt:0 "You are #bold not#! [GetTrait('incapable').GetName( GetPlayer )]"
 halfsade_abdicate_blocked_trait_tt:0 "You do #bold not#! have the [traits|E]: [GetTrait('ambitious').GetName( GetPlayer )], [GetTrait('greedy').GetName( GetPlayer )] or a [GetTrait('conqueror').GetName( GetPlayer )]"

 halfsade_abdicate.0001.t:0 "A Heavy Decision"
 halfsade_abdicate.0001.desc:0 "The time has come for me to lay down the heavy burdens of rule. Should I announce my abdication, my court will be thrown into temporary unrest as preparations are made, and in #V 15 days#! the crown will pass to [halfsade_abdicate_heir.GetTitledFirstName].\n\n#weak There is still time to change my mind, though the [prestige|E] spent on the announcement will not return.#!"
 halfsade_abdicate.0001.a:0 "I will abdicate."
 halfsade_abdicate.0001.b:0 "Not yet. I will keep the crown."

 halfsade_abdicate.0002.t:0 "The Crown Passes"
 halfsade_abdicate.0002.desc:0 "#F It is time. Before the gathered court, I lay down the burdens of rule and place the crown upon the head of [halfsade_abdicate_heir.GetTitledFirstName]. May they rule wisely and well.#!"
 halfsade_abdicate.0002.a:0 "Long may they reign."

 halfsade_abdicate_pending_modifier:0 "Countdown to Abdication"
 halfsade_abdicate_pending_modifier_desc:0 "The realm is uneasy as the ruler prepares to step down."
 halfsade_abdicate_transition_modifier:0 "Shaky Succession"
 halfsade_abdicate_transition_modifier_desc:0 "The realm is still adjusting to the sudden change in rule."
 halfsade_abdicate_unready_modifier:0 "Unready for the Crown"
 halfsade_abdicate_unready_modifier_desc:0 "Crowned too young, this ruler is anxious and overwhelmed by the weight of rule."
 halfsade_abdicate_retired_modifier:0 "Peaceful Retirement"
 halfsade_abdicate_retired_modifier_desc:0 "Free of the burdens of the crown, this former ruler finds it easier to rest."
 halfsade_abdicate_abdicated_modifier:0 "Retired Ruler"
 halfsade_abdicate_abdicated_modifier_desc:0 "Having laid down the crown once, this person will never be handed it again by abdication."
